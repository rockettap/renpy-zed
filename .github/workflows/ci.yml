name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --target wasm32-wasip2 -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Build extension
        run: cargo build --release --target wasm32-wasip2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate extension assets
        run: python3 tests/test_extension_assets.py

      - name: Validate runnable tasks
        run: python3 tests/test_tasks.py

      - name: Validate grammar and queries
        run: scripts/check-grammar.sh

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-wasm
          path: target/wasm32-wasip2/release/renpy_zed.wasm
          if-no-files-found: error
